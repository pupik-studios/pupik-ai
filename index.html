
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101114">
  <title>Pupik AI</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #101114;
      --panel: #191a20;
      --panel2: #22232b;
      --text: #f4f4f7;
      --muted: #a5a6b2;
      --accent: #a78bfa;
      --border: #30313b;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   sans-serif;
      min-height: 100dvh;
    }

    button, textarea { font: inherit; }

    button {
      cursor: pointer;
      color: var(--text);
      border: 1px solid var(--border);
      background: var(--panel2);
      border-radius: 12px;
      padding: 10px 14px;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px max(16px, env(safe-area-inset-left));
      background: rgba(16,17,20,.94);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(16px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 750;
      font-size: 18px;
    }

    .logo {
      display: grid;
      place-items: center;
      width: 36px;
      height: 36px;
      border-radius: 12px;
      background: var(--accent);
      color: #171321;
      font-weight: 900;
    }

    #status {
      font-size: 12px;
      color: var(--muted);
      margin-top: 3px;
    }

    main {
      width: min(850px, 100%);
      margin: auto;
      padding: 20px 16px 180px;
    }

    #welcome {
      text-align: center;
      padding: 15vh 8px 40px;
    }

    #welcome .big {
      font-size: clamp(32px, 7vw, 52px);
      font-weight: 850;
      letter-spacing: -1.5px;
    }

    #welcome p {
      color: var(--muted);
      line-height: 1.6;
    }

    #messages {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .message {
      display: flex;
      flex-direction: column;
      gap: 7px;
      max-width: 100%;
    }

    .message.user { align-items: flex-end; }

    .role {
      font-size: 12px;
      color: var(--muted);
      padding: 0 4px;
    }

    .bubble {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      line-height: 1.65;
      padding: 13px 16px;
      border-radius: 17px;
      max-width: 100%;
    }

    .user .bubble {
      background: #29253a;
      border: 1px solid #403858;
      max-width: min(88%, 650px);
    }

    .assistant .bubble {
      background: var(--panel);
      border: 1px solid var(--border);
      width: 100%;
    }

    .error { color: #ffaaaa; }

    .composer-wrap {
      position: fixed;
      z-index: 3;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 12px 16px max(16px, env(safe-area-inset-bottom));
      background: linear-gradient(transparent, var(--bg) 18%);
    }

    .composer {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      width: min(850px, 100%);
      margin: auto;
      padding: 10px;
      border: 1px solid #3b3c48;
      background: var(--panel);
      border-radius: 20px;
      box-shadow: 0 10px 40px #0005;
    }

    textarea {
      resize: none;
      min-height: 44px;
      max-height: 180px;
      flex: 1;
      width: 100%;
      color: var(--text);
      background: transparent;
      border: 0;
      outline: 0;
      padding: 11px 5px;
      line-height: 1.45;
    }

    #send {
      background: var(--accent);
      color: #171321;
      border: 0;
      font-weight: 750;
      min-height: 44px;
    }

    .hint {
      text-align: center;
      font-size: 11px;
      color: var(--muted);
      padding-top: 8px;
    }

    @media (max-width: 500px) {
      header { padding-top: 11px; padding-bottom: 11px; }
      main { padding-left: 12px; padding-right: 12px; }
      #welcome { padding-top: 12vh; }
      .bubble { padding: 12px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="logo">P</div>
      <div>
        <div>Pupik AI</div>
        <div id="status">Проверяю локальную модель…</div>
      </div>
    </div>
    <button id="newChat" type="button">＋ Новый чат</button>
  </header>

  <main>
    <section id="welcome">
      <div class="big">Привет!</div>
      <p>Я Pupik AI — локальный помощник.<br>
         Задай вопрос, и я постараюсь ответить.</p>
    </section>
    <section id="messages" aria-live="polite"></section>
  </main>

  <div class="composer-wrap">
    <form id="form" class="composer">
      <textarea id="prompt" rows="1"
        placeholder="Напиши сообщение…"
        aria-label="Сообщение"></textarea>
      <button id="send" type="submit">Отправить</button>
    </form>
    <div class="hint">Локальная модель на твоём Mac · Без платного API</div>
  </div>

  <script>
    const statusEl = document.getElementById("status");
    const welcome = document.getElementById("welcome");
    const messagesEl = document.getElementById("messages");
    const form = document.getElementById("form");
    const promptEl = document.getElementById("prompt");
    const sendBtn = document.getElementById("send");
    const newChatBtn = document.getElementById("newChat");

    const HISTORY_KEY = "pupik-ai-history-v1";
    let messages = [];
    let busy = false;

    function setStatus(text) {
      statusEl.textContent = text;
    }

    function saveHistory() {
      try {
        localStorage.setItem(HISTORY_KEY, JSON.stringify(messages));
      } catch (e) {
        console.warn("Не удалось сохранить историю", e);
      }
    }

    function addBubble(role, text, isError = false) {
      welcome.hidden = true;

      const article = document.createElement("article");
      article.className = "message " + role;

      const label = document.createElement("div");
      label.className = "role";
      label.textContent = role === "user" ? "Ты" : "Pupik AI";

      const bubble = document.createElement("div");
      bubble.className = "bubble" + (isError ? " error" : "");
      bubble.textContent = text;

      article.append(label, bubble);
      messagesEl.appendChild(article);
      window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
      return bubble;
    }

    function renderHistory() {
      messagesEl.replaceChildren();
      welcome.hidden = messages.length > 0;

      for (const message of messages) {
        if (message.role === "user" || message.role === "assistant") {
          addBubble(message.role, message.content);
        }
      }
    }

    async function checkStatus() {
      try {
        const response = await fetch("/api/status");
        const data = await response.json();

        if (!response.ok || !data.ok) {
          setStatus("Ollama не найдена");
          return;
        }

        if (!data.modelInstalled) {
          setStatus("Сначала скачай модель на Mac");
          return;
        }

        setStatus("● Локальная модель готова");
      } catch (error) {
        setStatus("Нет связи с локальным сервером");
      }
    }

    async function sendMessage(text) {
      if (busy || !text.trim()) return;

      busy = true;
      sendBtn.disabled = true;
      promptEl.disabled = true;

      messages.push({ role: "user", content: text.trim() });
      addBubble("user", text.trim());
      saveHistory();

      const pending = addBubble("assistant", "Думаю…");

      try {
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ messages })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || "Неизвестная ошибка");
        }

        const answer = (data.answer || "").trim();
        if (!answer) throw new Error("Модель вернула пустой ответ");

        pending.textContent = answer;
        messages.push({ role: "assistant", content: answer });
        saveHistory();
        setStatus("● Локальная модель готова");
      } catch (error) {
        pending.textContent =
          "Не удалось получить ответ.\n\n" + error.message +
          "\n\nПроверь, что Ollama и server.py запущены на Mac.";
        pending.classList.add("error");
        setStatus("Ошибка соединения");
      } finally {
        busy = false;
        sendBtn.disabled = false;
        promptEl.disabled = false;
        promptEl.focus();
        window.scrollTo({
          top: document.body.scrollHeight,
          behavior: "smooth"
        });
      }
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const text = promptEl.value;
      if (!text.trim() || busy) return;

      promptEl.value = "";
      promptEl.style.height = "44px";
      await sendMessage(text);
    });

    promptEl.addEventListener("input", () => {
      promptEl.style.height = "44px";
      promptEl.style.height =
        Math.min(promptEl.scrollHeight, 180) + "px";
    });

    promptEl.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        form.requestSubmit();
      }
    });

    newChatBtn.addEventListener("click", () => {
      if (busy) return;
      messages = [];
      saveHistory();
      renderHistory();
      promptEl.focus();
    });

    try {
      const saved = JSON.parse(localStorage.getItem(HISTORY_KEY) || "[]");
      if (Array.isArray(saved)) {
        messages = saved.filter(item =>
          item &&
          (item.role === "user" || item.role === "assistant") &&
          typeof item.content === "string"
        );
      }
    } catch (e) {
      messages = [];
    }

    renderHistory();
    checkStatus();
  </script>
</body>
</html>
