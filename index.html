
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pupik AI</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #080b14;
    color: #f5f7ff;
    height: 100dvh;
    overflow: hidden;
}

button, textarea { font: inherit; }

#loading {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: radial-gradient(ellipse at top, #192753, #080b14 70%);
}

.loading-box {
    width: min(420px, 100%);
    text-align: center;
}

.logo {
    width: 76px;
    height: 76px;
    display: grid;
    place-items: center;
    margin: 0 auto 20px;
    border-radius: 24px;
    background: linear-gradient(135deg, #6366f1, #06b6d4);
    font-size: 36px;
    font-weight: 900;
    box-shadow: 0 0 50px #6366f144;
}

h1 { margin: 0; font-size: 36px; }
.subtitle { color: #aab6d2; margin: 12px 0 32px; }

.progress-row {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 10px;
    font-size: 13px;
    text-align: left;
}

#loadStatus { color: #b7c4df; }
#percent { color: #67e8f9; font-weight: bold; }

.track {
    height: 9px;
    border-radius: 20px;
    background: #26304a;
    overflow: hidden;
}

#bar {
    width: 0%;
    height: 100%;
    background: linear-gradient(90deg, #6366f1, #22d3ee);
    transition: width .2s;
}

.note {
    color: #8290ad;
    font-size: 12px;
    line-height: 1.7;
    margin-top: 22px;
}

#retry {
    display: none;
    margin: 20px auto 0;
    padding: 12px 20px;
    background: #6366f1;
    color: white;
    border: 0;
    border-radius: 12px;
    cursor: pointer;
}

#app {
    display: none;
    height: 100dvh;
    max-width: 1000px;
    margin: auto;
    flex-direction: column;
}

header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 17px 20px;
    border-bottom: 1px solid #20283b;
}

.brand { font-size: 20px; font-weight: 800; }
.online { color: #67e8a5; font-size: 12px; margin-top: 4px; }

#clear {
    border: 1px solid #303b54;
    border-radius: 10px;
    background: #141b2b;
    color: #dce5fa;
    padding: 9px 12px;
    cursor: pointer;
}

#messages {
    flex: 1;
    overflow-y: auto;
    padding: 22px 16px;
    display: flex;
    flex-direction: column;
    gap: 16px;
}

.welcome {
    margin: auto;
    text-align: center;
    max-width: 430px;
    color: #b5c0d8;
    line-height: 1.7;
}

.welcome h2 { color: white; font-size: 26px; }

.message {
    max-width: 85%;
    padding: 13px 16px;
    border-radius: 17px;
    line-height: 1.65;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}

.user {
    align-self: flex-end;
    background: #3346a3;
    border-bottom-right-radius: 5px;
}

.assistant {
    align-self: flex-start;
    background: #151d2d;
    border: 1px solid #26314a;
    border-bottom-left-radius: 5px;
}

.typing { color: #93a5ca; }

footer {
    padding: 14px 16px max(14px, env(safe-area-inset-bottom));
    border-top: 1px solid #20283b;
}

#composer {
    display: flex;
    align-items: flex-end;
    gap: 10px;
    padding: 8px;
    background: #141b2b;
    border: 1px solid #303b54;
    border-radius: 18px;
}

#prompt {
    flex: 1;
    min-width: 0;
    max-height: 150px;
    resize: vertical;
    border: 0;
    outline: 0;
    background: transparent;
    color: white;
    padding: 10px 8px;
}

#prompt::placeholder { color: #8290aa; }

#send {
    width: 43px;
    height: 43px;
    flex-shrink: 0;
    border: 0;
    border-radius: 13px;
    background: linear-gradient(135deg, #6366f1, #0891b2);
    color: white;
    font-size: 20px;
    cursor: pointer;
}

#send:disabled { opacity: .45; cursor: wait; }

.footer-note {
    text-align: center;
    font-size: 11px;
    color: #7785a0;
    margin-top: 10px;
}

@media (max-width: 500px) {
    header { padding: 14px; }
    #messages { padding: 16px 12px; }
    .message { max-width: 92%; }
}
</style>
</head>

<body>

<section id="loading">
    <div class="loading-box">
        <div class="logo">P</div>
        <h1>Pupik AI</h1>
        <p class="subtitle">Твой личный ИИ в браузере</p>

        <div class="progress-row">
            <span id="loadStatus">Подготовка модели...</span>
            <span id="percent">0%</span>
        </div>

        <div class="track">
            <div id="bar"></div>
        </div>

        <p class="note" id="loadNote">
            При первом запуске скачиваются файлы модели.
            <br>Не закрывай страницу во время загрузки.
        </p>

        <button id="retry">Повторить загрузку</button>
    </div>
</section>

<main id="app">
    <header>
        <div>
            <div class="brand">✦ Pupik AI</div>
            <div class="online" id="modelStatus">Локальный ИИ</div>
        </div>
        <button id="clear">Новый чат</button>
    </header>

    <section id="messages" aria-live="polite"></section>

    <footer>
        <form id="composer">
            <textarea
                id="prompt"
                rows="1"
                placeholder="Напиши сообщение Pupik AI..."
                aria-label="Сообщение"
            ></textarea>
            <button id="send" type="submit" aria-label="Отправить">↑</button>
        </form>
        <div class="footer-note">
            Ответы генерируются локальной моделью на твоём устройстве
        </div>
    </footer>
</main>

<script type="module">
const MODEL_ID = "Llama-3.2-1B-Instruct-q4f16_1-MLC";
const HISTORY_KEY = "pupik-ai-local-history-v1";

const $ = id => document.getElementById(id);

let engine = null;
let busy = false;
let history = [];

try {
    const saved = JSON.parse(localStorage.getItem(HISTORY_KEY) || "[]");
    if (Array.isArray(saved)) {
        history = saved.filter(item =>
            item &&
            ["user", "assistant"].includes(item.role) &&
            typeof item.content === "string"
        ).slice(-40);
    }
} catch {
    history = [];
}

function setProgress(progress) {
    if (typeof progress?.progress === "number") {
        const percent = Math.round(
            Math.max(0, Math.min(1, progress.progress)) * 100
        );
        $("percent").textContent = percent + "%";
        $("bar").style.width = percent + "%";
    }

    if (progress?.text) {
        $("loadStatus").textContent = progress.text;
    }
}

function showError(error) {
    console.error("Pupik AI:", error);

    $("loadStatus").textContent = "Не удалось загрузить модель";
    $("loadNote").textContent =
        (error?.message || String(error)) +
        " Проверь интернет, поддержку WebGPU и Console.";

    $("retry").style.display = "inline-block";
}

async function loadModel() {
    $("retry").style.display = "none";

    if (!("gpu" in navigator)) {
        throw new Error(
            "WebGPU недоступен. Используй актуальный Chrome и проверь поддержку GPU."
        );
    }

    setProgress({ text: "Подключение движка ИИ..." });

    const webllm = await import(
        "https://esm.run/@mlc-ai/web-llm"
    );

    setProgress({ text: "Загрузка и подготовка модели..." });

    engine = await webllm.CreateMLCEngine(MODEL_ID, {
        initProgressCallback: progress => setProgress(progress)
    });

    $("percent").textContent = "100%";
    $("bar").style.width = "100%";
    $("loadStatus").textContent = "ИИ готов к работе!";

    await new Promise(resolve => setTimeout(resolve, 500));

    $("loading").style.display = "none";
    $("app").style.display = "flex";
    $("modelStatus").textContent = "● ИИ готов · локальная модель";

    renderHistory();
    $("prompt").focus();
}

function saveHistory() {
    try {
        localStorage.setItem(
            HISTORY_KEY,
            JSON.stringify(history.slice(-40))
        );
    } catch (error) {
        console.warn("История не сохранена:", error);
    }
}

function addBubble(role, content) {
    const welcome = $("messages").querySelector(".welcome");
    if (welcome) welcome.remove();

    const bubble = document.createElement("div");
    bubble.className = "message " +
        (role === "user" ? "user" : "assistant");

    // Используем textContent, чтобы сообщения не выполнялись как HTML.
    bubble.textContent = content;

    $("messages").appendChild(bubble);
    $("messages").scrollTop = $("messages").scrollHeight;

    return bubble;
}

function renderHistory() {
    $("messages").replaceChildren();

    if (!history.length) {
        const welcome = document.createElement("div");
        welcome.className = "welcome";

        const heading = document.createElement("h2");
        heading.textContent = "Привет! Я Pupik AI";

        const text = document.createElement("p");
        text.textContent =
            "Я работаю на локальной языковой модели. " +
            "Спроси меня о чём угодно или попроси объяснить сложную тему.";

        welcome.append(heading, text);
        $("messages").appendChild(welcome);
        return;
    }

    for (const item of history) {
        addBubble(item.role, item.content);
    }
}

async function sendMessage(event) {
    event?.preventDefault();

    if (busy || !engine) return;

    const prompt = $("prompt").value.trim();
    if (!prompt) return;

    busy = true;
    $("send").disabled = true;
    $("prompt").disabled = true;

    $("prompt").value = "";

    history.push({ role: "user", content: prompt });
    addBubble("user", prompt);
    saveHistory();

    const typing = addBubble("assistant", "Думаю...");
    typing.classList.add("typing");

    try {
        const result = await engine.chat.completions.create({
            messages: [
                {
                    role: "system",
                    content:
                        "Ты Pupik AI, полезный и дружелюбный помощник. " +
                        "Отвечай на языке пользователя. " +
                        "Объясняй ясно и честно. Не выдумывай факты, " +
                        "не утверждай, что выполнил действия, которых не выполнял."
                },
                ...history.slice(-20)
            ],
            temperature: 0.7,
            max_tokens: 700
        });

        const answer =
            result.choices?.[0]?.message?.content?.trim() ||
            "Не удалось получить ответ. Попробуй ещё раз.";

        typing.classList.remove("typing");
        typing.textContent = answer;

        history.push({ role: "assistant", content: answer });
        history = history.slice(-40);
        saveHistory();
    } catch (error) {
        console.error("Ошибка генерации:", error);
        typing.classList.remove("typing");
        typing.textContent =
            "Ошибка генерации ответа: " +
            (error?.message || String(error));
    } finally {
        busy = false;
        $("send").disabled = false;
        $("prompt").disabled = false;
        $("prompt").focus();
        $("messages").scrollTop = $("messages").scrollHeight;
    }
}

$("composer").addEventListener("submit", sendMessage);

$("prompt").addEventListener("keydown", event => {
    if (event.key === "Enter" && !event.shiftKey && !event.isComposing) {
        event.preventDefault();
        sendMessage(event);
    }
});

$("clear").addEventListener("click", () => {
    if (busy) return;
    history = [];
    saveHistory();
    renderHistory();
    $("prompt").focus();
});

$("retry").addEventListener("click", async () => {
    try {
        await loadModel();
    } catch (error) {
        showError(error);
    }
});

try {
    await loadModel();
} catch (error) {
    showError(error);
}
</script>

</body>
</html>
