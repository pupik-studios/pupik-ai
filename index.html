

<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101114">
  <title>Pupik AI</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>

<div class="app">

  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-icon">P</div>
      <span>Pupik AI</span>
    </div>

    <button class="new-chat" id="newChat">
      <span>＋</span> Новый чат
    </button>

    <div class="sidebar-label">ТВОИ ЧАТЫ</div>
    <div class="history" id="history"></div>

    <div class="sidebar-bottom">
      <div class="profile-icon">P</div>
      <div>
        <strong>Pupik User</strong>
        <small>Личный помощник</small>
      </div>
    </div>
  </aside>

  <main class="main">

    <header class="topbar">
      <button class="menu-button" id="menuButton" aria-label="Меню">☰</button>
      <div class="top-title">Новый диалог</div>

      <div class="model-status">
        <span class="status-dot" id="statusDot"></span>
        <span id="statusText">Нейросеть ещё не загружена</span>
      </div>
    </header>

    <section class="chat-area">

      <div class="welcome" id="welcome">
        <div class="welcome-logo">P</div>
        <h1>Привет! Я Pupik AI</h1>
        <p>Твой AI-агент. Задай вопрос — и начнём.</p>

        <div class="suggestions">

          <button class="suggestion" data-prompt="Объясни мне сложную тему простыми словами">
            <span>📚</span>
            <strong>Объяснить тему</strong>
            <small>Простые объяснения</small>
          </button>

          <button class="suggestion" data-prompt="Придумай интересную идею для проекта">
            <span>💡</span>
            <strong>Придумать идею</strong>
            <small>Идеи для проектов</small>
          </button>

          <button class="suggestion" data-prompt="Помоги написать программу">
            <span>💻</span>
            <strong>Написать код</strong>
            <small>Программирование</small>
          </button>

          <button class="suggestion" data-prompt="Расскажи что-нибудь интересное">
            <span>🌍</span>
            <strong>Узнать новое</strong>
            <small>Интересные факты</small>
          </button>

        </div>
      </div>

      <div class="messages" id="messages"></div>

    </section>

    <footer class="composer-area">
      <form class="composer" id="chatForm">
        <textarea
          id="messageInput"
          placeholder="Напиши сообщение Pupik AI..."
          rows="1"
          autocomplete="off"
        ></textarea>

        <button type="submit" id="sendButton" aria-label="Отправить">↑</button>
      </form>

      <div class="disclaimer">
        Pupik AI может ошибаться. Проверяй важную информацию.
      </div>
    </footer>

  </main>
</div>

<script type="module" src="./app.js"></script>

</body>
</html>
