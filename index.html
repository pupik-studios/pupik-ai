
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pupik AI</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #0b0b13;
      color: #f5f3ff;
      font-family: Arial, sans-serif;
      min-height: 100vh;
    }

    .app {
      max-width: 850px;
      height: 100dvh;
      margin: auto;
      display: flex;
      flex-direction: column;
      padding: 18px;
    }

    header {
      padding: 12px 0 18px;
      border-bottom: 1px solid #282638;
    }

    h1 {
      margin: 0;
      font-size: 27px;
      color: #b69aff;
    }

    .subtitle {
      margin-top: 7px;
      color: #aaa7c2;
      font-size: 13px;
    }

    #status {
      margin-top: 12px;
      color: #c8b9ff;
      font-size: 13px;
      line-height: 1.5;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding: 20px 0;
    }

    .message {
      max-width: 90%;
      padding: 13px 16px;
      border-radius: 16px;
      line-height: 1.55;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .user {
      align-self: flex-end;
      background: #6546c8;
    }

    .ai {
      align-self: flex-start;
      background: #1c1b2a;
      border: 1px solid #302d43;
    }

    .bottom {
      border-top: 1px solid #282638;
      padding-top: 14px;
    }

    textarea {
      display: block;
      width: 100%;
      resize: vertical;
      min-height: 55px;
      max-height: 150px;
      padding: 14px;
      border-radius: 13px;
      border: 1px solid #37334b;
      background: #171622;
      color: white;
      font: inherit;
      outline: none;
    }

    textarea:focus {
      border-color: #9675ff;
    }

    .buttons {
      display: flex;
      gap: 9px;
      margin-top: 9px;
    }

    button {
      border: 0;
      border-radius: 11px;
      padding: 12px 16px;
      cursor: pointer;
      font-weight: bold;
      font-size: 14px;
    }

    #send {
      flex: 1;
      background: #8864f5;
      color: white;
    }

    #clear {
      background: #242232;
      color: #e2dcff;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .hint {
      color: #89869f;
      font-size: 12px;
      line-height: 1.5;
      margin-top: 10px;
    }
  </style>
</head>

<body>
  <main class="app">
    <header>
      <h1>✦ Pupik AI</h1>
      <div class="subtitle">Твой личный ИИ-помощник</div>
      <div id="status">Нажми «Загрузить ИИ», чтобы начать.</div>
    </header>

    <section id="chat" aria-live="polite">
      <div class="message ai">
        Привет! Я Pupik AI. Я могу отвечать на вопросы, помогать с идеями и объяснять сложные вещи простыми словами.
      </div>
    </section>

    <section class="bottom">
      <textarea id="prompt" placeholder="Напиши сообщение..."></textarea>

      <div class="buttons">
        <button id="send" disabled>Отправить</button>
        <button id="clear">Очистить чат</button>
      </div>

      <div class="buttons">
        <button id="load" style="width:100%">Загрузить ИИ</button>
      </div>

      <div class="hint">
        Первый запуск может занять несколько минут и скачать большую модель.
        Не закрывай страницу во время загрузки.
      </div>
    </section>
  </main>

  <script type="module">
    import { pipeline } from
      "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.7.2";

    const MODEL = "onnx-community/Qwen2.5-0.5B-Instruct";

    const statusBox = document.getElementById("status");
    const chat = document.getElementById("chat");
    const promptBox = document.getElementById("prompt");
    const sendButton = document.getElementById("send");
    const loadButton = document.getElementById("load");
    const clearButton = document.getElementById("clear");

    let generator = null;
    let busy = false;
    let history = [];

    function addMessage(text, type) {
      const el = document.createElement("div");
      el.className = "message " + type;
      el.textContent = text;
      chat.appendChild(el);
      chat.scrollTop = chat.scrollHeight;
      return el;
    }

    async function loadModel() {
      if (generator || busy) return;

      busy = true;
      loadButton.disabled = true;
      statusBox.textContent =
        "Загружаю ИИ. При первом запуске нужно скачать модель...";

      try {
        const options = {
          dtype: "q4"
        };

        if (navigator.gpu) {
          try {
            statusBox.textContent =
              "Пробую запустить ИИ на видеопроцессоре...";
            generator = await pipeline(
              "text-generation",
              MODEL,
              { ...options, device: "webgpu" }
            );
          } catch (gpuError) {
            console.warn("WebGPU недоступен, пробую CPU:", gpuError);
            generator = null;
          }
        }

        if (!generator) {
          statusBox.textContent =
            "Запускаю ИИ на процессоре. Это может быть медленно...";
          generator = await pipeline(
            "text-generation",
            MODEL,
            { ...options, device: "wasm" }
          );
        }

        statusBox.textContent =
          "ИИ готов! Можешь задавать вопросы.";
        sendButton.disabled = false;
        loadButton.textContent = "ИИ загружен";
      } catch (error) {
        console.error(error);
        statusBox.textContent =
          "Не удалось загрузить модель. Проверь интернет, обнови страницу и попробуй снова.";
        loadButton.disabled = false;
        loadButton.textContent = "Повторить загрузку";
      } finally {
        busy = false;
      }
    }

    async function sendMessage() {
      const text = promptBox.value.trim();
      if (!text || !generator || busy) return;

      addMessage(text, "user");
      promptBox.value = "";
      history.push({ role: "user", content: text });

      busy = true;
      sendButton.disabled = true;
      statusBox.textContent = "Pupik AI думает...";

      const replyBubble = addMessage("Думаю...", "ai");

      try {
        const messages = [
          {
            role: "system",
            content:
              "Ты Pupik AI — дружелюбный универсальный помощник. " +
              "Отвечай прямо на вопрос пользователя, понятно и по делу. " +
              "Не оценивай пользователя, не ставь оценки и баллы. " +
              "Отвечай на языке пользователя."
          },
          ...history.slice(-10)
        ];

        const result = await generator(messages, {
          max_new_tokens: 180,
          temperature: 0.7,
          do_sample: true
        });

        const output = result[0].generated_text;
        let answer = "";

        if (Array.isArray(output)) {
          const last = output[output.length - 1];
          answer = last?.content || "";
        } else if (typeof output === "string") {
          answer = output;
        }

        if (!answer.trim()) {
          throw new Error("Модель не вернула текст.");
        }

        replyBubble.textContent = answer.trim();
        history.push({
          role: "assistant",
          content: answer.trim()
        });

        statusBox.textContent = "Готово.";
      } catch (error) {
        console.error(error);
        replyBubble.textContent =
          "Не получилось получить ответ. Попробуй ещё раз.";
        history.pop();
        statusBox.textContent = "Ошибка генерации ответа.";
      } finally {
        busy = false;
        sendButton.disabled = !generator;
        chat.scrollTop = chat.scrollHeight;
      }
    }

    loadButton.addEventListener("click", loadModel);
    sendButton.addEventListener("click", sendMessage);

    promptBox.addEventListener("keydown", event => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
      }
    });

    clearButton.addEventListener("click", () => {
      history = [];
      chat.replaceChildren();
      addMessage("Чат очищен. Что обсудим?", "ai");
    });
  </script>
</body>
</html>
