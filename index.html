<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <title>Pupik AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css?v=10" />
</head>
<body>
  <div class="atmosphere" aria-hidden="true"></div>
  <div class="layout">
    <aside class="chats" aria-label="Чаты">
      <button type="button" id="new-chat" class="new-chat">+ чат</button>
      <div id="chat-list" class="chat-list"></div>
    </aside>

    <main class="shell">
      <header class="brand-bar">
        <div class="brand">
          <p class="mark">Pupik AI</p>
          <p class="tag">болтает · задачи · агент · критики</p>
        </div>
        <div class="meta">
          <span id="status" data-state="idle">на связи</span>
          <button type="button" id="agent-mode" title="Режим агента: саб-агенты критики" aria-pressed="false">агент</button>
          <button type="button" id="clear-chat" title="Сброс беседы">сброс</button>
        </div>
      </header>

      <section id="log" class="log" aria-live="polite"></section>

      <form id="composer" class="composer">
        <label class="attach" title="Прикрепить файл">
          <span aria-hidden="true">📎</span>
          <input type="file" id="file" multiple accept="image/*,.txt,.md,.json,.csv,.js,.py,.html,.css,.log" />
        </label>
        <label class="sr" for="input">Сообщение</label>
        <textarea id="input" rows="1" placeholder="Текст, «нарисуй кота» или 📎 файл…" autocomplete="off"></textarea>
        <button type="submit" aria-label="Отправить">→</button>
      </form>
    </main>
  </div>
  <script type="module" src="app.js?v=10"></script>
</body>
</html>
